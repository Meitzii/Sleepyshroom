<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sleepyshroom — Little screens, sweeter dreams</title>
    <meta name="description" content="Cozy, cute, and dreamy digital wallpapers for desktop, mobile, and tablet. Made with love for your cozy digital spaces." />
    <meta property="og:title" content="sleepyshroom — Little screens, sweeter dreams" />
    <meta property="og:description" content="Cozy, cute, and dreamy digital wallpapers for desktop, mobile, and tablet. Made with love for your cozy digital spaces." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Google Fonts: Comfortaa & Quicksand -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FFFCF7] text-[#292929] antialiased selection:bg-[#FCF3E2] selection:text-[#292929]">
    <div id="root"></div>
    <script>
      (function () {
        try {
          var search = window.location.search || '';
          var hash = window.location.hash || '';
          var hasOAuthPayload =
            /[?&](code|error|error_description)=/.test(search) ||
            /access_token=|refresh_token=|error=|error_description=/.test(hash);
          if (
            window.opener &&
            !window.opener.closed &&
            (window.name === 'sleepyshroom_google_oauth' || window.location.pathname.indexOf('/auth/callback') === 0) &&
            hasOAuthPayload
          ) {
            window.opener.postMessage(
              {
                type: 'SLEEPYSHROOM_OAUTH_CALLBACK',
                search: search,
                hash: hash
              },
              '*'
            );
            setTimeout(function () {
              try { window.close(); } catch (e) {}
            }, 120);
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
